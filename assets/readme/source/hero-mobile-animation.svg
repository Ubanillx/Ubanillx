  <text x="58" y="674" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="30" fill="#DCEAE4">NovaCloudEdu</text>

  <rect x="40" y="706" width="6" height="6" fill="#FFB86B"/>
  <text x="58" y="712" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-size="30" fill="#DCEAE4">DocMaster</text>
